# Experiment configuration.
#
# NOTE ON YAML AND SCIENTIFIC NOTATION: PyYAML does not auto-cast strings like
# `6.371e6` to float unless the exponent carries an explicit sign. Every such
# constant below uses `e+` form, and config.py coerces defensively regardless.

domain:
  # Fixed across every arm and every verification spacing. SAL's L1 term is
  # normalised by the domain diagonal, so a shifting domain makes L incomparable.
  name: "sydney_illawarra"
  lat_bounds: [-35.5, -32.0]
  lon_bounds: [149.5, 152.5]

verification:
  # The delta sweep IS the spatial-resolution result.
  spacings_km: [5, 10, 25, 50, 100]
  accumulation: "24h"
  # Wernli f = 1/15, plus fixed and percentile thresholds for the sensitivity table.
  threshold_factor: 0.0666666666666667
  fixed_thresholds_mm: [1.0, 5.0, 20.0]
  percentile_thresholds: [95, 99]
  sal_backend: "auto"      # {auto, scores, reference}
  trim_partial_cells: true # drop verification cells with coverage < 1

data:
  cache_dir: "~/BoM/sal_resolution_cache"
  coarse:
    product: "BARRA-R2"
    variable: "pr"
    approx_spacing_km: 12.0
  fine:
    product: "BARRA-C2"
    variable: "pr"
    approx_spacing_km: 4.4
  truth:
    product: "rainfields3"
    root: "/g/data/rq0"     # requires NCI project rq0
    min_valid_fraction: 0.98
  static:
    orography_var: "orog"
    wind_level_hpa: 925

events:
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022]
  min_domain_mean_mm: 2.0
  wet_threshold_mm: 1.0
  min_wet_fraction: 0.02
  min_objects: 1
  min_coverage: 0.9
  target_n: 30            # bootstrap CIs are not credible much below this

symbolic:
  enabled: true
  niterations: 100
  maxsize: 20             # interpretability is the point; 40 is a black box
  parsimony: 3.0e-3
  binary_operators: ["+", "-", "*", "/"]
  unary_operators: ["exp", "log_abs", "tanh", "square"]
  structure_weight_strength: 1.0
  patch_size: 5
  max_rows: 200000
  random_state: 0

validation:
  cv: "loyo"              # year-blocked; random splits leak spatial autocorrelation
  n_bootstrap: 10000
  alpha: 0.05
  baselines: ["identity", "scalar_bias", "quantile_map", "unsharp"]
  run_permutation_control: true
